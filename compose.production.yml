name: city-route

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *service-logging

  backend:
    build:
      context: .
      dockerfile: ops/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ${CITY_ROUTE_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      CITY_ROUTE_USE_PERSISTENCE: "true"
      CITY_ROUTE_STORAGE_BACKEND: mysql
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; raise SystemExit(0 if urlopen('http://127.0.0.1:8011/health', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    logging: *service-logging

  frontend:
    build:
      context: .
      dockerfile: ops/Dockerfile.frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8011
        NEXT_PUBLIC_AMAP_JS_KEY: ${NEXT_PUBLIC_AMAP_JS_KEY}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8011
      AMAP_SECURITY_JS_CODE: ${AMAP_SECURITY_JS_CODE}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    logging: *service-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CITY_ROUTE_DOMAIN: ${CITY_ROUTE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *service-logging

  backup:
    build:
      context: .
      dockerfile: ops/Dockerfile.backend
    restart: unless-stopped
    user: "0:0"
    command: ["python", "-m", "app.tools.backup_loop"]
    env_file:
      - ${CITY_ROUTE_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      CITY_ROUTE_USE_PERSISTENCE: "true"
      CITY_ROUTE_STORAGE_BACKEND: mysql
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      BACKUP_DIRECTORY: /backups
    volumes:
      - database_backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    logging: *service-logging

  monitor:
    build:
      context: .
      dockerfile: ops/Dockerfile.backend
    restart: unless-stopped
    command: ["python", "-m", "app.tools.monitor"]
    environment:
      CITY_ROUTE_LOG_LEVEL: ${CITY_ROUTE_LOG_LEVEL:-INFO}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:-3}
      MONITOR_BACKEND_HEALTH_URL: http://backend:8011/health
      MONITOR_BACKEND_READINESS_URL: http://backend:8011/api/system/readiness
      MONITOR_FRONTEND_URL: http://frontend:3000
      MONITOR_PUBLIC_URL: https://${CITY_ROUTE_DOMAIN}/api/backend/health
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *service-logging

volumes:
  mysql_data:
  database_backups:
  caddy_data:
  caddy_config:
